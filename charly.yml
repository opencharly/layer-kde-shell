kde-shell:
    candy:
        description: |
            Installs the shared SDDM-free KDE Plasma Wayland session package set — plasma-desktop, the core session components, a curated app set, and the kdotool KWin automation tool — used by both the bare-metal seat and the headless streamed pod.
            The SDDM-free KDE Plasma Wayland SESSION package set — the shared subset
            needed by BOTH the bare-metal KDE desktop (kde-desktop, which adds SDDM +
            graphical.target on a real GPU output) AND the headless streamed KDE pod
            (kde-selkies, which runs startplasma-wayland nested in pixelflux with no
            seat). plasma-desktop is the dependency-pulling top package (drags
            plasma-workspace + kwin_wayland + plasmashell + kf6 + qt6 + breeze as
            deps). Only the core session components + a curated app set usable in
            both venues live here; workstation-only extras (partition tools,
            kdeconnect, bluetooth, firewall/thunderbolt, kwallet, kinfocenter, media
            players) stay in kde-desktop so the streaming pod is not bloated. Factored
            out of kde-desktop so the bare-metal seat and the headless pod share ONE
            package list (R3). require: dbus (the Plasma session bus). Every package
            lands a binary at a fixed /usr/bin path, so presence is directly verifiable.
        require:
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
        distro:
            arch:
                package:
                    # Dependency-pulling top package: plasma-desktop pulls
                    # plasma-workspace + kwin_wayland + plasmashell + kf6 + qt6 + breeze.
                    - plasma-desktop
                    - xorg-xwayland
                    # Core Plasma session components (needed headless AND bare-metal).
                    - plasma-pa
                    - plasma-nm
                    - powerdevil
                    - kscreen
                    - kde-gtk-config
                    - breeze-gtk
                    - kdialog
                    - kio-admin
                    # Curated KDE apps usable in both the seat and the stream.
                    - ark
                    - dolphin
                    - konsole
                    - kate
                    - kcalc
                    - gwenview
                    - spectacle
        plan:
            - run: kdotool is fetched from its OWN pinned release, not an AUR builder
              id: kde-shell-kdotool-download
              # WHY NOT `aur: package: [kdotool]`: AUR packages are installed by an
              # EXTERNALIZED detection builder (sdk render_prep: "for each matching candy an
              # EXTERNALIZED detection builder (pixi/npm/aur) ... the COPY lines come from
              # the plugin"). When that builder does not run, the package is SILENTLY
              # skipped and the build still exits 0 — measured on arch AND cachyos bases
              # (opencharly/layer-kde-shell#7). A pinned release tarball needs no helper, no
              # cargo, and cannot be dropped silently.
              download: https://github.com/jinliu/kdotool/releases/download/v0.3.0/kdotool-0.3.0-x86_64-unknown-linux-gnu.tar.gz
              to: /tmp/kdotool
              extract: tar.gz
            - run: install the kdotool binary where the wl verb expects it
              id: kde-shell-kdotool-install
              command: |
                set -eu
                install -Dm755 /tmp/kdotool/kdotool /usr/bin/kdotool
                test -x /usr/bin/kdotool
              run_as: root
            - check: plasmashell, the Plasma shell, is installed at /usr/bin/plasmashell
              file:
                file: /usr/bin/plasmashell
                exists: true
            - check: kwin_wayland, the Wayland compositor, is installed at /usr/bin/kwin_wayland
              file:
                file: /usr/bin/kwin_wayland
                exists: true
            - check: startplasma-wayland, the session entry point, is installed at /usr/bin/startplasma-wayland
              file:
                file: /usr/bin/startplasma-wayland
                exists: true
            - check: the dependency-pulling top package plasma-desktop is installed in the rpm/pacman database
              package:
                package: plasma-desktop
                installed: true
            - check: the Dolphin file manager is installed at /usr/bin/dolphin
              file:
                file: /usr/bin/dolphin
                exists: true
            - check: the Konsole terminal is installed at /usr/bin/konsole
              file:
                file: /usr/bin/konsole
                exists: true
            - check: kdotool, the KWin window-management automation tool that drives the wl check verb on KWin, is installed at /usr/bin/kdotool
              file:
                file: /usr/bin/kdotool
                exists: true

kde-shell-skill:
    skill:
        name: kde-shell
        family: selkies
        owner: kde-shell
        description: |-
            The SDDM-free KDE Plasma Wayland SESSION package leaf — the package set shared by the bare-metal KDE desktop (kde-desktop) and the headless streamed KDE pod (kde-selkies). MUST be invoked before editing the kde-shell or kde-desktop package partition.
